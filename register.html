<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- taiwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- google fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Dancing+Script:wght@400..700&family=Elsie:wght@400;900&family=Italianno&family=Kameron:wght@400..700&family=Montenegrin+Gothic+One&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Protest+Revolution&display=swap" rel="stylesheet">
<!--  -->
<style>
    *{
         font-family: "Playfair Display", serif;
    }
</style>
</head>
<body class="bg-blue-100">
    <div class=" bg-blue-200 shadow-2xl w-76  mx-auto mt-30 p-10 rounded-2xl ">
        <div class="flex items-center justify-center"><img class="" width="100px" src="https://pngimg.com/uploads/bank/bank_PNG5.png" alt=""></div>
        <h1 class="text-2xl text-blue-900 font-semibold text-center mb-6">Register Your Account</h1>
        <form class="flex flex-col">
            <label for="" class=" mt-3">Username</label>
            <input id="accuser" type="" class="border rounded-lg shadow-xl  p-1" placeholder="Enter your userame">

            <label for="" class=" mt-3">Account Number</label>
            <input id="accnum" type="number" class="border rounded-lg shadow-xl p-1" placeholder="0000000000000">
            
            <label for="" class=" mt-3">Password</label>
            <input id="accpass" type="password" class="border rounded-lg shadow-xl p-1" placeholder="Enter your password">

            <div class=" mt-3 text-white">
                <button type="button" class=" bg-blue-400  rounded-lg mr-3 p-3" onclick="register()">Register</button>
            <button type="reset" class=" bg-blue-400  rounded-lg p-3">Reset</button>
            </div>
            
        </form>
    </div>
</body>
<script src="./register.js"></script>
</html>
